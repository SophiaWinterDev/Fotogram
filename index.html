<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fotogram</title>
        <link
            rel="shortcut icon"
            href="./assets/icon/fotogram-logo.svg"
            type="image/x-icon"
        />

        <script defer src="./script.js"></script>
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./fonts.css" />
        <link rel="stylesheet" href="./variables.css" />
    </head>
    <body onload="init()">
        <header>
            <div>
                <img
                    src="./assets/icon/fotogram-logo.svg"
                    alt="Fotogram Logo"
                />
                <p>Fotogram</p>
            </div>
        </header>
        <main>
            <h1>My personal photo album</h1>
            <ul id="galleryWrapper" class="gallery-wrapper"></ul>
            <dialog id="galleryDialog">
                <header>
                    <p id="dialogHeadline"></p>
                    <button>
                        <img
                            src="./assets/icon/close-icon.svg"
                            alt="Close Icon"
                        />
                    </button>
                </header>
                <section id="imageSection"></section>
                <footer>
                    <button>
                        <img
                            src="./assets/icon/arrow-icon.svg"
                            alt="Arrow Left"
                        />
                    </button>
                    <p id="dialogPagenumber"></p>
                    <button>
                        <img
                            src="./assets/icon/arrow-icon.svg"
                            alt="Arrow Right"
                        />
                    </button>
                </footer>
            </dialog>
        </main>
        <footer>
            <div>
                <img
                    src="./assets/icon/fotogram-logo.svg"
                    alt="Fotogram Logo"
                />
                <p>Fotogram</p>
            </div>
            <p>© 2026 Fotogram</p>
        </footer>
    </body>
</html>
