<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fotogram</title>
        <link
            rel="shortcut icon"
            href="./assets/icon/fotogram-logo.svg"
            type="image/x-icon"
        />

        <script defer src="./script.js"></script>
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./fonts.css" />
        <link rel="stylesheet" href="./variables.css" />
    </head>
    <body onload="init()">
        <header>
            <img src="./assets/icon/fotogram-logo.svg" alt="Fotogram Logo" />
            <p>Fotogram</p>
        </header>
        <main>
            <h1>My personal photo album</h1>
            <ul id="galleryWrapper" class="gallery-wrapper"></ul>
            <dialog id="galleryDialog" onclick="closeDialog()">
                <header onclick="bubblingPrevention(event)">
                    <h2 id="dialogHeadline"></h2>
                    <button
                        class="close-button"
                        onclick="closeDialog()"
                        aria-label="Close image window"
                    >
                        <img
                            class="close-button-image"
                            src="./assets/icon/close-icon.svg"
                            alt="Close Icon"
                        />
                    </button>
                </header>
                <section
                    id="imageSection"
                    class="image-section"
                    onclick="bubblingPrevention(event)"
                ></section>
                <footer onclick="bubblingPrevention(event)">
                    <button
                        class="previous-button"
                        onclick="showPreviousImage()"
                        aria-label="Show previous image"
                    >
                        <img
                            id="previousButton"
                            class="previous-button-image"
                            src="./assets/icon/arrow-icon.svg"
                            alt="Arrow Left"
                        />
                    </button>
                    <p id="dialogPagenumber"></p>
                    <button
                        class="next-button"
                        onclick="showNextImage()"
                        aria-label="Show next image"
                    >
                        <img
                            id="nextButton"
                            class="next-button-image"
                            src="./assets/icon/arrow-icon.svg"
                            alt="Arrow Right"
                        />
                    </button>
                </footer>
            </dialog>
        </main>
        <footer>
            <div>
                <img
                    src="./assets/icon/fotogram-logo.svg"
                    alt="Fotogram Logo"
                />
                <p>Fotogram</p>
            </div>
            <p>© 2026 Fotogram</p>
        </footer>
    </body>
</html>
